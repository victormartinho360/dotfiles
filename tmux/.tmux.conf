# ==============================================================================
# TMUX CONFIGURATION - Minimalist Tokyo Night + Instant Which-Key + WSL2
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. CONFIGURAÇÕES GERAIS E DE PERFORMANCE
# ------------------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -s extended-keys on
set -as terminal-features ",*:RGB,*:extkeys"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%dm'

set -sg escape-time 0              # Zero delay ao pressionar Esc (essencial p/ Neovim)
set -g history-limit 50000         # Histórico grande de scrollback
set -g display-time 2500           # Tempo das mensagens na barra de status
set -g status-interval 5           # Intervalo de atualização da status bar
set -g focus-events on             # Eventos de foco para o Neovim recarregar arquivos

# Numeração de janelas e painéis começando em 1 (mais ergonômico no teclado)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on         # Renumera janelas automaticamente ao fechar uma

# Suporte completo a Mouse
set -g mouse on

# ------------------------------------------------------------------------------
# 2. LEADER KEY (Ctrl+Space abre o Which-Key instantâneo; Ctrl+a como prefixo raw)
# ------------------------------------------------------------------------------
# Nota: no tmux, a tecla definida em `set -g prefix` entra em espera silenciosa
# e ignora `bind -n`. Por isso deixamos `C-a` como prefixo raw interno e
# mapeamos `C-Space` (e `C-@`, que muitos terminais enviam no Ctrl+Space)
# direto na tabela root para abrir o Which-Key instantaneamente!
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Atalhos diretos na tabela prefix (para compatibilidade e uso rápido)
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind x confirm-before -p "Fechar painel atual? (y/n)" kill-pane
bind z resize-pane -Z
bind R source-file ~/.tmux.conf \; display-message " 󰑓 ~/.tmux.conf recarregado!"

# Troca rápida de janelas com Alt + Número (sem precisar de prefixo)
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# ------------------------------------------------------------------------------
# 3. MODO DE CÓPIA ESTILO VIM + INTEGRAÇÃO CLIPBOARD WSL2
# ------------------------------------------------------------------------------
setw -g mode-keys vi
set -g set-clipboard on

bind [ copy-mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "clip.exe"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "clip.exe"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "clip.exe"

# ------------------------------------------------------------------------------
# 4. NAVEGAÇÃO VIM <-> TMUX (Ctrl + h/j/k/l sem prefixo)
# ------------------------------------------------------------------------------
# Integração nativa com (Neo)vim (também gerenciada pelo vim-tmux-navigator)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind -n C-\\ if-shell "$is_vim" "send-keys C-\\" "select-pane -l"

# ------------------------------------------------------------------------------
# 5. WHICH-KEY MENU INSTANTÂNEO AO APERTAR LEADER (Ctrl+Space)
# ------------------------------------------------------------------------------
# Estilo do popup Which-Key (Tokyo Night)
set -g menu-style "bg=#16161e,fg=#c0caf5"
set -g menu-selected-style "bg=#7aa2f7,fg=#16161e,bold"
set -g menu-border-style "bg=#16161e,fg=#3b4261"
set -g menu-border-lines "rounded"
set -g popup-style "bg=#16161e,fg=#c0caf5"
set -g popup-border-style "bg=#16161e,fg=#7aa2f7"
set -g popup-border-lines "rounded"

# Menu Principal e Submenus Which-Key via command-alias nativos do Tmux
set -s command-alias[100] wk-main='display-menu -T "#[fg=#7aa2f7,bold] 󰌌 Which-Key (Leader) " -x L -y S \
  "Dividir Vertical (Direita)"    v "split-window -h -c \"#{pane_current_path}\"" \
  "Dividir Horizontal (Abaixo)"   s "split-window -v -c \"#{pane_current_path}\"" \
  "Nova Janela (Tab)"             c "new-window -c \"#{pane_current_path}\"" \
  "Zoom no Painel Atual"          z "resize-pane -Z" \
  "Terminal Flutuante (Toggle)"   f "run-shell \"~/.local/bin/tmux-palette --float #{pane_current_path}\"" \
  "" \
  "+Painéis (Panes)        󰅂"     p "wk-panes" \
  "+Janelas (Windows)      󰅂"     w "wk-windows" \
  "+Redimensionar (Resize) 󰅂"     r "wk-resize" \
  "+Sessões & Resurrect    󰅂"     S "wk-sessions" \
  "+Plugins & Config       󰅂"     P "wk-plugins" \
  "" \
  "Buscar Sessão/Janela (FZF)"    o "display-popup -E -w 75% -h 75% -T \" #[fg=#9ece6a,bold]󰆍 Sessões \" \"~/.local/bin/tmux-palette --sessions\"" \
  "Prompt de Comando (:) c/ Box"  ":" "display-popup -E -x L -y S -w 95 -h 14 -T \" #[fg=#e0af68,bold]󰘳 Comando Tmux (:) \" \"~/.local/bin/tmux-palette --cmd\"" \
  "Paleta de Ações (Espaço)"      Space "display-popup -E -w 75% -h 65% -T \" #[fg=#7aa2f7,bold]󰘳 Ações Rápidas \" \"~/.local/bin/tmux-palette --actions\"" \
  "Modo Cópia / Busca (Vim)"      "[" "copy-mode" \
  "Fechar Painel Atual"           x "confirm-before -p \"Fechar painel? (y/n)\" kill-pane"'

set -s command-alias[101] wk-panes='display-menu -T "#[fg=#bb9af7,bold] 󰯌 Painéis (Panes) " -x L -y S \
  "Dividir Vertical (v)"          v "split-window -h -c \"#{pane_current_path}\"" \
  "Dividir Horizontal (s)"        s "split-window -v -c \"#{pane_current_path}\"" \
  "Maximizar / Zoom (z)"          z "resize-pane -Z" \
  "" \
  "Mover para Esquerda"           h "select-pane -L" \
  "Mover para Baixo"              j "select-pane -D" \
  "Mover para Cima"               k "select-pane -U" \
  "Mover para Direita"            l "select-pane -R" \
  "" \
  "Trocar c/ Painel Anterior"     "{" "swap-pane -U" \
  "Trocar c/ Próximo Painel"      "}" "swap-pane -D" \
  "Transformar em Nova Janela"    "!" "break-pane" \
  "Mostrar Números dos Painéis"   q "display-panes" \
  "Sincronizar Digitação (Sync)"  "=" "setw synchronize-panes \; display-message \"Sync panes: #{?pane_synchronized,ON,OFF}\"" \
  "Fechar Painel"                 x "confirm-before -p \"Fechar painel? (y/n)\" kill-pane" \
  "" \
  "󰁍 Voltar ao Menu Principal"    BSpace "wk-main"'

set -s command-alias[102] wk-windows='display-menu -T "#[fg=#7dcfff,bold] 󰖯 Janelas (Windows) " -x L -y S \
  "Nova Janela"                   c "new-window -c \"#{pane_current_path}\"" \
  "Renomear Janela"               r "command-prompt -I \"#W\" \"rename-window -- \\\"%%\\\"\"" \
  "Próxima Janela"                n "next-window" \
  "Janela Anterior"               p "previous-window" \
  "Última Janela Visitada"        l "last-window" \
  "" \
  "Buscar Janela (FZF)"           f "display-popup -E -w 75% -h 75% -T \" #[fg=#7dcfff,bold]󰖯 Janelas \" \"~/.local/bin/tmux-palette --windows\"" \
  "Árvore Interativa"             w "choose-tree -Zw" \
  "" \
  "Ir para Janela 1"              1 "select-window -t 1" \
  "Ir para Janela 2"              2 "select-window -t 2" \
  "Ir para Janela 3"              3 "select-window -t 3" \
  "Ir para Janela 4"              4 "select-window -t 4" \
  "Ir para Janela 5"              5 "select-window -t 5" \
  "Fechar Janela Inteira"         x "confirm-before -p \"Fechar janela #W? (y/n)\" kill-window" \
  "" \
  "󰁍 Voltar ao Menu Principal"    BSpace "wk-main"'

set -s command-alias[103] wk-resize='display-menu -T "#[fg=#e0af68,bold] 󰩨 Redimensionar (h/j/k/l repete, Esc sai) " -x L -y S \
  "Esquerda (-5)"                 h "resize-pane -L 5 \; wk-resize" \
  "Baixo (+5)"                    j "resize-pane -D 5 \; wk-resize" \
  "Cima (-5)"                     k "resize-pane -U 5 \; wk-resize" \
  "Direita (+5)"                  l "resize-pane -R 5 \; wk-resize" \
  "" \
  "Igualar Larguras (Horizontal)" E "select-layout even-horizontal" \
  "Igualar Alturas (Vertical)"    V "select-layout even-vertical" \
  "Layout Tiled (Grade)"          t "select-layout tiled" \
  "" \
  "󰁍 Voltar ao Menu Principal"    BSpace "wk-main"'

set -s command-alias[104] wk-sessions='display-menu -T "#[fg=#9ece6a,bold] 󰆍 Sessões & Persistência " -x L -y S \
  "Trocar Sessão c/ FZF"          o "display-popup -E -w 75% -h 75% -T \" #[fg=#9ece6a,bold]󰆍 Sessões \" \"~/.local/bin/tmux-palette --sessions\"" \
  "Nova Sessão (com nome)"        n "command-prompt -p \"Nome da nova sessão:\" \"new-session -d -s \\\"%%\\\" \; switch-client -t \\\"%%\\\"\"" \
  "Renomear Sessão Atual"         r "command-prompt -I \"#S\" \"rename-session -- \\\"%%\\\"\"" \
  "Alternar p/ Última Sessão"     l "switch-client -l" \
  "Árvore de Sessões"             s "choose-tree -Zs" \
  "Matar Sessão(ões) (FZF)"       x "display-popup -E -w 75% -h 75% -T \" #[fg=#f7768e,bold]󰆴 Matar Sessões \" \"~/.local/bin/tmux-palette --kill-session\"" \
  "Desconectar (Detach)"          d "detach-client" \
  "" \
  "󰆓 Salvar Sessão (Resurrect)"   S "run-shell ~/.tmux/plugins/tmux-resurrect/scripts/save.sh" \
  "󰑓 Restaurar Sessão (Resurrect)" R "run-shell ~/.tmux/plugins/tmux-resurrect/scripts/restore.sh" \
  "" \
  "󰁍 Voltar ao Menu Principal"    BSpace "wk-main"'

set -s command-alias[105] wk-plugins='display-menu -T "#[fg=#f7768e,bold] 󰏖 Plugins (TPM) & Config " -x L -y S \
  "Recarregar ~/.tmux.conf"       R "source-file ~/.tmux.conf \; display-message \" 󰑓 ~/.tmux.conf recarregado!\"" \
  "Instalar Plugins (TPM)"        I "run-shell ~/.tmux/plugins/tpm/bindings/install_plugins" \
  "Atualizar Plugins (TPM)"       U "run-shell ~/.tmux/plugins/tpm/bindings/update_plugins" \
  "Limpar Plugins Antigos (TPM)"  C "run-shell ~/.tmux/plugins/tpm/bindings/clean_plugins" \
  "Listar Todos os Atalhos"       "?" "list-keys -N" \
  "" \
  "󰁍 Voltar ao Menu Principal"    BSpace "wk-main"'

# Abre o Which-Key instantaneamente ao pressionar Ctrl+' (via C-_ / C-') ou Ctrl+Space
bind -n C-_ wk-main
bind -n "C-'" wk-main
bind -n C-Space wk-main
bind -n C-@ wk-main
# Atalho direto Alt+f para abrir/esconder o Terminal Flutuante
bind -n M-f run-shell "~/.local/bin/tmux-palette --float '#{pane_current_path}'"
bind Space wk-main
bind p wk-panes
bind w wk-windows
bind r wk-resize
bind S wk-sessions
bind P wk-plugins

# ------------------------------------------------------------------------------
# 6. TEMA MINIMALISTA MODERNO - TOKYO NIGHT (Status Bar Embaixo)
# ------------------------------------------------------------------------------
# Paleta Tokyo Night:
# bg_dark  = #16161e | bg       = #1a1b26 | bg_high = #292e42
# fg       = #c0caf5 | fg_muted = #565f89 | border  = #3b4261
# blue     = #7aa2f7 | purple   = #bb9af7 | cyan    = #7dcfff
# green    = #9ece6a | yellow   = #e0af68 | red     = #f7768e

set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=#16161e,fg=#c0caf5"

# Bordas dos painéis discretas e elegantes
set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=#7aa2f7"

# Estilo de mensagens e prompt de comando
set -g message-style "bg=#292e42,fg=#7dcfff,bold"
set -g message-command-style "bg=#292e42,fg=#bb9af7,bold"
setw -g mode-style "bg=#292e42,fg=#7aa2f7,bold"

# Esquerda da Barra: Nome da sessão + indicadores de estado (Copy / Zoom / Sync)
set -g status-left-length 60
set -g status-left "#{?pane_in_mode,#[bg=#e0af68 fg=#16161e bold] COPY ,#[bg=#7aa2f7 fg=#16161e bold] 󰆍 #S }#{?window_zoomed_flag,#[bg=#bb9af7 fg=#16161e bold] 󰁌 ZOOM ,}#{?pane_synchronized,#[bg=#f7768e fg=#16161e bold] 󰓦 SYNC ,}#[bg=#16161e,fg=#565f89] "

# Janelas (Tabs): Minimalistas com destaque Tokyo Night na janela ativa
setw -g window-status-separator ""
setw -g window-status-format "#[bg=#16161e,fg=#565f89]  #I:#W  "
setw -g window-status-current-format "#[bg=#292e42,fg=#7aa2f7,bold]  #I:#W#{?window_zoomed_flag, 󰁌,}  "
setw -g window-status-activity-style "fg=#e0af68"
setw -g window-status-bell-style "fg=#f7768e,bold"

# Direita da Barra: Diretório atual compacto + Hora
set -g status-right-length 80
set -g status-right "#[fg=#565f89]#{b:pane_current_path} #[fg=#292e42]│ #[fg=#7aa2f7,bold]%H:%M "

# ------------------------------------------------------------------------------
# 7. PLUGINS (TPM - Tmux Plugin Manager)
# ------------------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'omerxx/tmux-sessionx'

# Configurações do Resurrect & Continuum (salva e restaura sessões + Neovim)
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Configuração do tmux-sessionx (atalho Prefix + o)
set -g @sessionx-bind 'o'
set -g @sessionx-window-height '80%'
set -g @sessionx-window-width '75%'
set -g @sessionx-zoxide-mode 'on'

# Inicializa o TPM (deve ficar sempre na última linha do ~/.tmux.conf)
if "test -f ~/.tmux/plugins/tpm/tpm" \
   "run '~/.tmux/plugins/tpm/tpm'"
