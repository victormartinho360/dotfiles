# ==============================================================================
# TOKYO NIGHT THEME FOR FOOT TERMINAL
# ==============================================================================

[main]
font=MonoidNerdFontMono-Regular:size=14
pad=15x15
initial-window-mode=maximized

[colors-dark]
# Transparência mantida em 0.80
alpha=0.80

# Fundo Ultra Dark p/ Tela IPS (#06060a - sem aspecto azulado) e Texto Tokyo Night (#c0caf5)
background=06060a
foreground=c0caf5

## Paleta ANSI Normal (Tokyo Night)
regular0=0c0c12       # Black (Ultra Dark Background)
regular1=f7768e       # Red (Reversal Red)
regular2=9ece6a       # Green
regular3=e0af68       # Yellow / Orange
regular4=7aa2f7       # Blue (Limitless Blue)
regular5=bb9af7       # Magenta (Hollow Purple)
regular6=7dcfff       # Cyan (Six Eyes Cyan)
regular7=a9b1d6       # White (Soft Foreground)

## Paleta ANSI Brilhante (Tokyo Night)
bright0=414868        # Bright Black (Comments / Muted)
bright1=ff899d       # Bright Red
bright2=b9f27c       # Bright Green
bright3=ff9e64       # Bright Yellow / Orange
bright4=8db0ff       # Bright Blue
bright5=c7a9ff       # Bright Magenta
bright6=a4daff       # Bright Cyan
bright7=c0caf5       # Bright White

## Cores Estendidas (16 e 17 - Laranja e Vermelho Escuro do Tokyo Night)
16=ff9e64
17=db4b4b

## Seleção, Links, Busca e Cursor
selection-foreground=c0caf5
selection-background=283457
urls=7dcfff
cursor=06060a bb9af7
jump-labels=06060a ff9e64
scrollback-indicator=06060a 7aa2f7
search-box-no-match=06060a f7768e
search-box-match=06060a 7dcfff

[cursor]
style=beam
blink=yes

[csd]
preferred=none
